name: Deploy to Contabo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /var/www/dronevideographylk
            git fetch origin main
            git reset --hard origin/main
            npm ci
            # Cloudflare caches the HTML pages for a few hours, so a page cached
            # just before this deploy still points at the previous build's hashed
            # /_next/static files. The build deletes them, so keep a week of old
            # assets and copy them back next to the new ones.
            ARCHIVE=/var/www/dronevideographylk-static-archive
            mkdir -p "$ARCHIVE"
            if [ -d .next/static ]; then rsync -a --ignore-existing .next/static/ "$ARCHIVE/"; fi
            npm run build
            rsync -a --ignore-existing "$ARCHIVE/" .next/static/
            find "$ARCHIVE" -type f -mtime +7 -delete
            # startOrRestart re-applies the pinned port/host from
            # ecosystem.config.js every deploy, so the isolation fix from
            # 2026-09-28 can never silently drift even if the server's PM2
            # process table is ever rebuilt from scratch.
            pm2 startOrRestart ecosystem.config.js --update-env
            pm2 save
            # Clear Cloudflare's cache so this deploy is live at once instead of
            # after the 2 hour edge cache on HTML pages. Needs a token limited to
            # Cache Purge on this zone in /root/.cloudflare-purge-token; without
            # it the step is skipped. Never fails the deploy.
            for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:4101/ && break; sleep 3; done
            if [ -f /root/.cloudflare-purge-token ]; then
              curl -s -X POST "https://api.cloudflare.com/client/v4/zones/8e288403f70cea391b840fe311172b64/purge_cache" \
                -H "Authorization: Bearer $(cat /root/.cloudflare-purge-token)" \
                -H "Content-Type: application/json" --data '{"purge_everything":true}' \
                | grep -o '"success":[a-z]*' || true
            else
              echo "Cloudflare purge skipped: no token on the server"
            fi
            # Ask Bing and the other IndexNow engines to recrawl the sitemap.
            # Never blocks or fails the deploy.
            node scripts/indexnow.mjs || true
