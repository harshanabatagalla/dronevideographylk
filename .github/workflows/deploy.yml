name: Deploy to Contabo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /var/www/dronevideographylk
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            # startOrRestart re-applies the pinned port/host from
            # ecosystem.config.js every deploy, so the isolation fix from
            # 2026-09-28 can never silently drift even if the server's PM2
            # process table is ever rebuilt from scratch.
            pm2 startOrRestart ecosystem.config.js --update-env
            pm2 save
            # Ask Bing and the other IndexNow engines to recrawl the sitemap.
            # Never blocks or fails the deploy.
            node scripts/indexnow.mjs || true
